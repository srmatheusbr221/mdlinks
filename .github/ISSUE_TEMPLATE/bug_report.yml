name: Bug report
description: Something behaves differently from what the README says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A few lines of code or a command is plenty.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and Node.js version
      placeholder: "0.2.0 / node 22.11"
    validations:
      required: true
